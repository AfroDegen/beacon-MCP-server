name: Beacon MCP Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
  node-version: 20
      - name: Install
        run: npm install

      - name: Test MCP
        run: npm test